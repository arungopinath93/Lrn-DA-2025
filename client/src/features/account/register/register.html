<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadpw-lg">
    <div class="card-title justify-center text-3xl text-primary">
        Sing Up
    </div>
    <div class="card-body w-full">
        <form #registerForm="ngForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
            <input type="text" class="input w-full" name="email" [(ngModel)]="creds.email" placeholder="Email" required>
            <input type="text" class="input w-full" name="displayName" [(ngModel)]="creds.displayName" placeholder="Dispaly Name" required>
            <input type="password" class="input w-full" name="password" [(ngModel)]="creds.password" placeholder="password" required>
            <!-- <select class="select w-full">
                <option value="" disabled selected>Select a Member</option>
                @for (member of memberFromHome(); track $index) {
                    <option [value]="member.id">{{member.displayName}}</option>
                }
            </select> -->
            <div class="flex items-center justify-end gap-3">
                 <button class="btn" type="button" (click)="cancel()">Cancel</button>
                 <button class="btn btn-primary" type="submit">Register</button>
            </div>
        </form>
    </div>
</div>
