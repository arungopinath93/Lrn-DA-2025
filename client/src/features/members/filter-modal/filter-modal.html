<dialog #filterModal class="modal">
  <div class="modal-box max-w-lg">
    <h3 class="font-bold text-lg">Select Filters</h3>
    <div class="flex justify-between w-full items-center mt-6">
        <div class="flex flex-col w-full gap-6">
            <label class="flex justify-between items-center">
                <span class="font-semibold">Select gender : </span>
                <form class="filter">
                    <input type="reset" value="x" class="btn btn-square">
                    <input type="radio" class="btn" [(ngModel)]="memberParams.gender" name="gender" value="male" aria-label="Male">
                    <input type="radio" class="btn" [(ngModel)]="memberParams.gender" name="gender" value="female" aria-label="Female">
                </form>
            </label>
            <label class="flex justify-between items-center">
                <span class="font-semibold">Select Age : </span>
                <form class="flex gap-3">
                    <input type="number" value="x" class="input w-20"  [min]="18"
                        [(ngModel)]="memberParams.minAge" name="minAge" (change)="onMinAgeChange()">
                    <input type="number" value="x" class="input w-20"  [min]="memberParams.minAge || 18"
                        [(ngModel)]="memberParams.maxAge" name="maxAge" (change)="onMaxAgeChange()">
                </form>
            </label>
            <label class="flex justify-between items-center">
                <span class="font-semibold">Order by : </span>
                <select class="select select-bordered w-full max-w-xs" [(ngModel)]="memberParams.orderBy" name="orderBy">
                    <option value="lastActive">Last Active</option>
                    <option value="created">Created</option>
                </select>
            </label>
        </div>
    </div>
    <div class="modal-action">
      <button (click)="submit()" class="btn btn-primary">Submit</button>
    </div>
  </div>

  <form method="dialog" class="modal-backdrop">
    <button (click)="close()"></button>
  </form>
</dialog>
