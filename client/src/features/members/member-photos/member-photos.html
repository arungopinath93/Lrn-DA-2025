@if(!memberService.editMode()){
   @if(photos(); as photos){
      @if(photos.length > 0){
         <div class="grid grid-cols-4 auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
            @for (photo of photos; track photo.id) {
               <div class="relative">
                  <img src="{{photo.url}}" alt="photo of member" class="w-full rounded-lg"> 
                  <button
                     (click)="setMainPhoto(photo)"
                     [disabled]="photo.url===memberService.member()?.imageUrl" 
                     class="btn btn-xs absolute top-1 right-1 z-50 cursor-pointer"
                     [class.btn-secondary]="photo.url===memberService.member()?.imageUrl"
                     [class.btn-active]="photo.url===memberService.member()?.imageUrl"
                     [class.btn-accent]="photo.url!==memberService.member()?.imageUrl"
                     >
                     @if(photo.url!==memberService.member()?.imageUrl){
                        <span>Set as default</span>
                     }
                  </button> 
                  <button
                     (click)="deletePhoto(photo)"
                     [disabled]="photo.url===memberService.member()?.imageUrl" 
                     class="btn btn-xs absolute top-1 left-1 z-50 cursor-pointer"
                     [class.btn-secondary]="photo.url===memberService.member()?.imageUrl"
                     [class.btn-active]="photo.url===memberService.member()?.imageUrl"
                     [class.btn-accent]="photo.url!==memberService.member()?.imageUrl"
                     >
                     @if(photo.url!==memberService.member()?.imageUrl){
                        <span>delete</span>
                     }
                  </button> 
               </div>
            }
         </div>
      } @else{
         <p class="text-center text-gray-500">No photos available</p>
      }
   }
} @else {
   <app-image-upload (uploadFile)="onUploadImage($event)" />
}
